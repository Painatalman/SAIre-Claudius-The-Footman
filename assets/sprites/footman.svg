<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#1a1a1a"/>

  <!-- Helmet (steel gray) -->
  <rect x="16" y="8" width="32" height="8" fill="#8c8c8c"/>
  <rect x="12" y="16" width="40" height="4" fill="#a0a0a0"/>
  <rect x="12" y="16" width="4" height="8" fill="#7a7a7a"/>
  <rect x="48" y="16" width="4" height="8" fill="#7a7a7a"/>

  <!-- Face/skin tone -->
  <rect x="20" y="20" width="24" height="20" fill="#d4a574"/>

  <!-- Eyes group (animatable) -->
  <g id="eyes">
    <!-- Left eye -->
    <rect x="24" y="26" width="6" height="4" fill="#ffffff"/>
    <rect x="26" y="27" width="2" height="2" fill="#2c1810"/>

    <!-- Right eye -->
    <rect x="34" y="26" width="6" height="4" fill="#ffffff"/>
    <rect x="36" y="27" width="2" height="2" fill="#2c1810"/>
  </g>

  <!-- Eyebrows (animatable) -->
  <g id="eyebrows">
    <rect x="24" y="24" width="6" height="2" fill="#5a4a3a"/>
    <rect x="34" y="24" width="6" height="2" fill="#5a4a3a"/>
  </g>

  <!-- Nose -->
  <rect x="30" y="30" width="4" height="6" fill="#c4956a"/>

  <!-- Mouth (animatable) -->
  <g id="mouth">
    <rect x="26" y="36" width="12" height="2" fill="#7a4a4a"/>
  </g>

  <!-- Beard -->
  <rect x="22" y="38" width="20" height="8" fill="#5a4a3a"/>
  <rect x="20" y="40" width="24" height="4" fill="#4a3a2a"/>

  <!-- Armor collar (metal) -->
  <rect x="16" y="46" width="32" height="12" fill="#7a7a7a"/>
  <rect x="20" y="48" width="24" height="8" fill="#8c8c8c"/>
  <rect x="24" y="50" width="16" height="4" fill="#a0a0a0"/>

  <!-- Armor detail lines -->
  <rect x="28" y="52" width="2" height="4" fill="#6a6a6a"/>
  <rect x="34" y="52" width="2" height="4" fill="#6a6a6a"/>

  <!-- Shoulder plates -->
  <rect x="12" y="54" width="8" height="8" fill="#7a7a7a"/>
  <rect x="44" y="54" width="8" height="8" fill="#7a7a7a"/>

  <!-- Border frame -->
  <rect x="0" y="0" width="64" height="2" fill="#4a3a2a"/>
  <rect x="0" y="62" width="64" height="2" fill="#4a3a2a"/>
  <rect x="0" y="0" width="2" height="64" fill="#4a3a2a"/>
  <rect x="62" y="0" width="2" height="64" fill="#4a3a2a"/>
</svg>
